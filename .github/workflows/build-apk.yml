
name: Fabriquer APK CraftCrousty Car

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android
        uses: android-actions/setup-android@v4
      - name: Installer SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler APK
        working-directory: CraftCroustyCar_AndroidStudio
        run: gradle --no-daemon :app:assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: CraftCroustyCar-APK
          path: CraftCroustyCar_AndroidStudio/app/build/outputs/apk/debug/app-debug.apk
